name: Sync reading assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v3 explainer
        run: |
          mkdir -p demos
          cat tools/v3_parts/part*.html > demos/convstencil_fig1_fig2_explainer_v3.html
          test -s demos/convstencil_fig1_fig2_explainer_v3.html
      - name: Download ConvStencil paper
        run: |
          mkdir -p paper
          curl -L --fail --retry 3 \
            'https://www.likun.tech/pdf/ppopp24_ConvStencil.pdf' \
            -o paper/ppopp24_ConvStencil.pdf
          test -s paper/ppopp24_ConvStencil.pdf
          file paper/ppopp24_ConvStencil.pdf | grep -qi PDF
      - name: Commit synced assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demos/convstencil_fig1_fig2_explainer_v3.html paper/ppopp24_ConvStencil.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'docs: sync original paper and v3 explainer'
          git push
