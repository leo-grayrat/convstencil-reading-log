name: Fetch paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ConvStencil paper
        run: |
          mkdir -p paper
          curl -L --fail --retry 3 \
            'https://www.likun.tech/pdf/ppopp24_ConvStencil.pdf' \
            -o paper/ppopp24_ConvStencil.pdf
          test -s paper/ppopp24_ConvStencil.pdf
          file paper/ppopp24_ConvStencil.pdf | grep -qi PDF
      - name: Commit paper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/ppopp24_ConvStencil.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add original ConvStencil paper'
          git push
