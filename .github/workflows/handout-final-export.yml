name: Handout final export

on:
  push:
    branches:
      - feat/roadmap-latex-handout-export

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-handout.txt
      - name: Install XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF
        run: python tools/export_handout.py roadmap.md
      - name: Commit PDF
        run: |
          mkdir -p presentation/generated
          cp build/handout/ConvStencil-Reading-Handout.pdf presentation/generated/ConvStencil-Reading-Handout.pdf
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add presentation/generated/ConvStencil-Reading-Handout.pdf
          git commit -m 'build: export final ConvStencil handout' || exit 0
          git push
