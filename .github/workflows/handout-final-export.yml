name: Handout final export

on:
  push:
    branches:
      - feat/roadmap-latex-handout-export

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install -r requirements-handout.txt
      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-fonts-recommended \
            poppler-utils
      - name: Build final handout
        run: python tools/export_handout.py roadmap.md
      - name: Render first-pass PDF diagnostics
        run: |
          mkdir -p build/handout/rendered
          pdftoppm -png -r 120 build/handout/ConvStencil-Reading-Handout.pdf build/handout/rendered/page
          pdfinfo build/handout/ConvStencil-Reading-Handout.pdf > build/handout/pdfinfo.txt
      - name: Upload handout artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConvStencil-Reading-Handout
          path: |
            build/handout/ConvStencil-Reading-Handout.pdf
            build/handout/handout.tex
            build/handout/handout.log
            build/handout/pdfinfo.txt
            build/handout/rendered/*.png
          if-no-files-found: error
