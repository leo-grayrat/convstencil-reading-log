name: Handout final export

on:
  pull_request:
    branches:
      - feat/roadmap-latex-handout-export

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-handout.txt
      - name: Generate TeX bundle
        run: python tools/export_handout.py roadmap.md --tex-only
      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: ConvStencil-Handout-Bundle
          path: |
            build/handout/**
            assets/**
            artifacts/僕は負けないよ.png
          if-no-files-found: error
