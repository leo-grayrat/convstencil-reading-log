name: Materialize final handout source

on:
  push:
    branches:
      - main
    paths:
      - 'presentation/handout/ConvStencil-Reading-Handout.tex.gz.b64'
      - '.github/workflows/materialize-final-handout.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Restore verified TeX and animation frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          from PIL import Image

          root = Path('.')
          handout = root / 'presentation' / 'handout'
          handout.mkdir(parents=True, exist_ok=True)

          packed = (handout / 'ConvStencil-Reading-Handout.tex.gz.b64').read_text().strip()
          tex = gzip.decompress(base64.b64decode(packed))
          digest = hashlib.sha256(tex).hexdigest()
          expected = '1be8277cbb4ff6a46e6c8ec1809be4c3872b4b98c9caac9778ae3159fe7e5a4b'
          if digest != expected:
              raise SystemExit(f'TeX checksum mismatch: {digest}')
          (handout / 'ConvStencil-Reading-Handout.tex').write_bytes(tex)

          src = root / 'assets' / 'v2-15fea61b768f7561648dbea164fcb75f_720w.webp'
          outdir = handout / 'assets'
          outdir.mkdir(parents=True, exist_ok=True)
          prefix = 'v2-15fea61b768f7561648dbea164fcb75f_720w-5334a150-frame-'
          with Image.open(src) as im:
              for i in range(getattr(im, 'n_frames', 1)):
                  im.seek(i)
                  im.convert('RGBA').save(outdir / f'{prefix}{i:04d}.png')
          PY
      - name: Remove staging files and commit source
        run: |
          rm -f presentation/handout/ConvStencil-Reading-Handout.tex.gz.b64
          rm -f presentation/handout/.keep
          rm -f .github/workflows/materialize-final-handout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'handout: add verified LaTeX source and animation frames'
          git push
